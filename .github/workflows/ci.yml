name: CI Build Check

on:
  pull_request:
    branches:
      - dev
      - release
      - main

jobs:
  build:
    name: Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run production build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "true"
          NODE_ENV: "production"